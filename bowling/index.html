<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Strike! Bowling 🎳</title>
<meta name="description" content="A fun flick-to-bowl bowling game for kids">
<meta name="theme-color" content="#FAF1E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bowling">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --ink:#241c12; --paper:#faf1e3; --field:#f2e8d5; --red:#e4572e;
    --mustard:#f5b82e; --teal:#1e91a8; --dim:#7a6e5c;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    background:#15100a; color:#fff;
  }
  body { position:fixed; inset:0; touch-action:none; }
  #app { display:flex; flex-direction:column; height:100dvh;
         padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .hidden { display:none !important; }

  /* ---------- MENU ---------- */
  #menu { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:14px; padding:max(20px, env(safe-area-inset-top)) 24px 24px;
          background-color:var(--paper);
          background-image:radial-gradient(#e3d4b4 1.2px, transparent 1.3px);
          background-size:24px 24px;
          color:var(--ink); overflow-y:auto; }
  #menu h1 { font-size:clamp(34px, 10vw, 52px); text-align:center; line-height:1.05;
             color:var(--ink); text-shadow:3px 3px 0 var(--mustard); letter-spacing:1px; }
  #menu h1 .ball { display:inline-block; animation:rollIn 1.6s ease infinite alternate; text-shadow:none; }
  @keyframes rollIn { from{ transform:rotate(-20deg) translateX(-6px);} to{ transform:rotate(20deg) translateX(6px);} }
  .highline { color:var(--red); font-weight:800; font-size:15px; min-height:20px; }
  .card { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:12px 14px; width:min(360px, 100%);
          display:flex; flex-direction:column; gap:10px; box-shadow:6px 6px 0 var(--ink); }
  .rowflex { display:flex; align-items:center; gap:10px; }
  .seg { display:flex; background:var(--field); border:2px solid var(--ink); border-radius:14px; padding:3px; flex:1; }
  .seg button { flex:1; border:0; background:transparent; color:var(--dim); font:inherit; font-weight:800;
                font-size:16px; padding:9px 0; border-radius:9px; }
  .seg button.on { background:var(--ink); color:var(--paper); }
  .pname { flex:1; min-width:0; border:2px solid var(--ink); border-radius:12px; padding:9px 12px; font:inherit; font-size:16px;
           font-weight:700; background:var(--field); color:var(--ink); outline:none; }
  .pname::placeholder { color:var(--dim); }
  .avatarBtn { font-size:26px; width:48px; height:44px; border-radius:12px; border:2px solid var(--ink); background:var(--field); }
  .togRow { display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; }
  .togRow small { display:block; font-weight:600; color:var(--dim); font-size:12px; }
  .tog { width:58px; height:32px; border-radius:16px; background:#d8c9ac; border:2px solid var(--ink); position:relative; transition:background .2s; flex-shrink:0; }
  .tog::after { content:''; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:12px;
                background:#fff; border:1.5px solid var(--ink); transition:left .2s; }
  .tog.on { background:var(--teal); } .tog.on::after { left:28px; }
  #playBtn { width:min(360px,100%); border:3px solid var(--ink); border-radius:18px; padding:15px; font:inherit; font-size:24px; font-weight:900;
             color:var(--paper); background:var(--red); box-shadow:6px 6px 0 var(--ink);
             letter-spacing:1px; }
  #playBtn:active { transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink); }

  /* ---------- GAME ---------- */
  #scoreboard { padding:6px 8px 4px; background:#1c1610ee; backdrop-filter:blur(6px); z-index:5;
                border-bottom:2px solid #00000066; }
  .sbPlayer { border-radius:12px; padding:4px 6px 5px; margin-bottom:4px; opacity:.55; transition:opacity .3s, background .3s; }
  .sbPlayer.active { opacity:1; background:#ffffff10; box-shadow:inset 0 0 0 1.5px var(--mustard); }
  .sbTop { display:flex; align-items:baseline; gap:6px; font-weight:800; font-size:14px; margin-bottom:3px; color:#f3ead8; }
  .sbTop .tot { margin-left:auto; font-size:17px; color:var(--mustard); }
  .frames { display:flex; gap:2px; }
  .fr { flex:1; min-width:0; background:#00000055; border-radius:5px; padding:1px 0 2px; text-align:center; }
  .fr.cur { background:#e4572ebb; box-shadow:0 0 0 1.5px var(--mustard); }
  .fr.f10 { flex:1.45; }
  .fr .rolls { font-size:10px; font-weight:800; letter-spacing:1px; min-height:12px; color:#fff; }
  .fr .cum { font-size:10px; font-weight:700; color:#cbbfa4; min-height:12px; }
  #laneWrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; bottom:max(10px, env(safe-area-inset-bottom)); text-align:center;
          font-weight:800; font-size:17px; color:var(--mustard); text-shadow:0 2px 4px #000; pointer-events:none;
          animation:bounceHint 1.4s ease infinite; z-index:4; padding:0 16px; }
  @keyframes bounceHint { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  #banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; z-index:6;
            font-size:clamp(40px,13vw,68px); font-weight:900; letter-spacing:2px; opacity:0;
            text-shadow:0 4px 0 #0008, 0 0 30px currentColor; }
  #banner.pop { animation:bannerPop 1.5s ease forwards; }
  #banner small { display:block; font-size:20px; letter-spacing:1px; color:#fff; }
  @keyframes bannerPop { 0%{ opacity:0; transform:scale(.3);} 14%{ opacity:1; transform:scale(1.15);}
                         24%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.05) translateY(-20px);} }
  .cornerBtns { position:absolute; top:6px; right:8px; z-index:7; display:flex; gap:8px; }
  .cornerBtns button { width:40px; height:40px; border-radius:12px; border:0; background:#0007; color:#fff; font-size:19px; }

  /* ---------- GAME OVER ---------- */
  #over { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:14px; padding:24px; text-align:center;
          background-color:var(--paper);
          background-image:radial-gradient(#e3d4b4 1.2px, transparent 1.3px);
          background-size:24px 24px;
          color:var(--ink); }
  #over .trophy { font-size:84px; animation:bounceHint 1.2s ease infinite; }
  #over h2 { font-size:32px; color:var(--ink); text-shadow:3px 3px 0 var(--mustard); }
  #over .result { font-size:19px; font-weight:800; line-height:1.7; }
  #over .result b { color:var(--red) !important; }
  #over .newhigh { color:var(--teal); font-weight:900; font-size:17px; min-height:22px; }
  #over button { border:3px solid var(--ink); border-radius:16px; padding:13px 34px; font:inherit; font-size:20px; font-weight:900;
                 box-shadow:5px 5px 0 var(--ink); }
  #over button:active { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
  #againBtn { background:var(--red); color:var(--paper); }
  #homeBtn2 { background:#fff; color:var(--ink); }

  #rotate { position:absolute; inset:0; z-index:60; background:#15100a; display:none; align-items:center; justify-content:center;
            text-align:center; font-size:22px; font-weight:800; padding:30px; }
  @media (orientation:landscape) and (max-height:500px) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div id="menu">
    <h1><span class="ball">🎳</span> STRIKE!<br>BOWLING</h1>
    <div class="highline" id="highline"></div>

    <div class="card">
      <div class="seg" id="playerSeg">
        <button data-n="1" class="on">1 Player</button>
        <button data-n="2">2 Players</button>
      </div>
      <div class="rowflex" id="p1row">
        <button class="avatarBtn" id="av1">🐯</button>
        <input class="pname" id="name1" maxlength="10" placeholder="Player 1" autocomplete="off">
      </div>
      <div class="rowflex hidden" id="p2row">
        <button class="avatarBtn" id="av2">🦄</button>
        <input class="pname" id="name2" maxlength="10" placeholder="Player 2" autocomplete="off">
      </div>
    </div>

    <div class="card">
      <div class="togRow"><span>🛡️ Bumpers<small>No gutter balls — great for kids!</small></span>
        <button class="tog on" id="togBumpers"></button></div>
      <div class="togRow"><span>📱 Tilt steering<small>Tilt your phone to curve the ball!</small></span>
        <button class="tog" id="togTilt"></button></div>
      <div class="togRow"><span>🔊 Sound &amp; voice<small>Crashes, cheers and the announcer</small></span>
        <button class="tog on" id="togSound"></button></div>
    </div>

    <button id="playBtn">▶︎ &nbsp;LET'S BOWL!</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div id="scoreboard"></div>
    <div id="laneWrap">
      <canvas id="lane"></canvas>
      <div id="banner"></div>
      <div id="hint"></div>
      <div class="cornerBtns">
        <button id="muteBtn">🔊</button>
        <button id="homeBtn">🏠</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="hidden">
    <div class="trophy">🏆</div>
    <h2>GAME OVER!</h2>
    <div class="result" id="overResult"></div>
    <div class="newhigh" id="overHigh"></div>
    <button id="againBtn">🎳 Play Again</button>
    <button id="homeBtn2">🏠 Menu</button>
  </div>

  <div id="rotate">📱 Please turn your phone upright to bowl!</div>
</div>
<script src="game.js"></script>
</body>
</html>
