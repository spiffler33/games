<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Strike! Bowling 🎳</title>
<meta name="description" content="A fun flick-to-bowl bowling game for kids">
<meta name="theme-color" content="#1a103c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bowling">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    background:#1a103c; color:#fff;
  }
  body { position:fixed; inset:0; touch-action:none; }
  #app { display:flex; flex-direction:column; height:100dvh;
         padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .hidden { display:none !important; }

  /* ---------- MENU ---------- */
  #menu { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:14px; padding:max(20px, env(safe-area-inset-top)) 24px 24px;
          background: radial-gradient(120% 90% at 50% 0%, #3b2a7a 0%, #1a103c 60%, #120a2c 100%);
          overflow-y:auto; }
  #menu h1 { font-size:clamp(34px, 10vw, 52px); text-align:center; line-height:1.05;
             text-shadow:0 4px 0 #0006; letter-spacing:1px; }
  #menu h1 .ball { display:inline-block; animation:rollIn 1.6s ease infinite alternate; }
  @keyframes rollIn { from{ transform:rotate(-20deg) translateX(-6px);} to{ transform:rotate(20deg) translateX(6px);} }
  .highline { color:#ffd166; font-weight:700; font-size:15px; min-height:20px; }
  .card { background:#ffffff14; border:1px solid #ffffff22; border-radius:18px; padding:12px 14px; width:min(360px, 100%);
          display:flex; flex-direction:column; gap:10px; }
  .rowflex { display:flex; align-items:center; gap:10px; }
  .seg { display:flex; background:#0006; border-radius:14px; padding:3px; flex:1; }
  .seg button { flex:1; border:0; background:transparent; color:#cbc3ee; font:inherit; font-weight:800;
                font-size:16px; padding:9px 0; border-radius:11px; }
  .seg button.on { background:#7c3aed; color:#fff; box-shadow:0 2px 8px #0006; }
  .pname { flex:1; min-width:0; border:0; border-radius:12px; padding:10px 12px; font:inherit; font-size:16px;
           font-weight:700; background:#0006; color:#fff; outline:none; }
  .avatarBtn { font-size:26px; width:48px; height:44px; border-radius:12px; border:0; background:#0006; }
  .togRow { display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; }
  .togRow small { display:block; font-weight:600; color:#bdb3e6; font-size:12px; }
  .tog { width:58px; height:32px; border-radius:16px; background:#0008; border:0; position:relative; transition:background .2s; flex-shrink:0; }
  .tog::after { content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:13px;
                background:#fff; transition:left .2s; }
  .tog.on { background:#34c759; } .tog.on::after { left:29px; }
  #playBtn { width:min(360px,100%); border:0; border-radius:20px; padding:16px; font:inherit; font-size:24px; font-weight:900;
             color:#fff; background:linear-gradient(180deg,#fb923c,#ea580c); box-shadow:0 6px 0 #9a3412, 0 10px 24px #0008;
             letter-spacing:1px; }
  #playBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #9a3412; }

  /* ---------- GAME ---------- */
  #scoreboard { padding:6px 8px 4px; background:#120a2cdd; backdrop-filter:blur(6px); z-index:5; }
  .sbPlayer { border-radius:12px; padding:4px 6px 5px; margin-bottom:4px; opacity:.55; transition:opacity .3s, background .3s; }
  .sbPlayer.active { opacity:1; background:#ffffff12; box-shadow:inset 0 0 0 1.5px #ffd16699; }
  .sbTop { display:flex; align-items:baseline; gap:6px; font-weight:800; font-size:14px; margin-bottom:3px; }
  .sbTop .tot { margin-left:auto; font-size:17px; color:#ffd166; }
  .frames { display:flex; gap:2px; }
  .fr { flex:1; min-width:0; background:#0005; border-radius:5px; padding:1px 0 2px; text-align:center; }
  .fr.cur { background:#7c3aedaa; box-shadow:0 0 0 1.5px #c4b5fd; }
  .fr.f10 { flex:1.45; }
  .fr .rolls { font-size:10px; font-weight:800; letter-spacing:1px; min-height:12px; color:#fff; }
  .fr .cum { font-size:10px; font-weight:700; color:#cbc3ee; min-height:12px; }
  #laneWrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; bottom:max(10px, env(safe-area-inset-bottom)); text-align:center;
          font-weight:800; font-size:17px; color:#ffd166; text-shadow:0 2px 4px #000; pointer-events:none;
          animation:bounceHint 1.4s ease infinite; z-index:4; padding:0 16px; }
  @keyframes bounceHint { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  #banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; z-index:6;
            font-size:clamp(40px,13vw,68px); font-weight:900; letter-spacing:2px; opacity:0;
            text-shadow:0 4px 0 #0008, 0 0 30px currentColor; }
  #banner.pop { animation:bannerPop 1.5s ease forwards; }
  #banner small { display:block; font-size:20px; letter-spacing:1px; color:#fff; }
  @keyframes bannerPop { 0%{ opacity:0; transform:scale(.3);} 14%{ opacity:1; transform:scale(1.15);}
                         24%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.05) translateY(-20px);} }
  .cornerBtns { position:absolute; top:6px; right:8px; z-index:7; display:flex; gap:8px; }
  .cornerBtns button { width:40px; height:40px; border-radius:12px; border:0; background:#0007; color:#fff; font-size:19px; }

  /* ---------- GAME OVER ---------- */
  #over { position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:14px; background:#120a2cee; backdrop-filter:blur(8px); padding:24px; text-align:center; }
  #over .trophy { font-size:84px; animation:bounceHint 1.2s ease infinite; }
  #over h2 { font-size:32px; color:#ffd166; }
  #over .result { font-size:19px; font-weight:800; line-height:1.7; }
  #over .newhigh { color:#34d399; font-weight:900; font-size:17px; min-height:22px; }
  #over button { border:0; border-radius:18px; padding:14px 34px; font:inherit; font-size:20px; font-weight:900; color:#fff; }
  #againBtn { background:linear-gradient(180deg,#fb923c,#ea580c); box-shadow:0 5px 0 #9a3412; }
  #homeBtn2 { background:#ffffff22; }

  #rotate { position:absolute; inset:0; z-index:60; background:#120a2c; display:none; align-items:center; justify-content:center;
            text-align:center; font-size:22px; font-weight:800; padding:30px; }
  @media (orientation:landscape) and (max-height:500px) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div id="menu">
    <h1><span class="ball">🎳</span> STRIKE!<br>BOWLING</h1>
    <div class="highline" id="highline"></div>

    <div class="card">
      <div class="seg" id="playerSeg">
        <button data-n="1" class="on">1 Player</button>
        <button data-n="2">2 Players</button>
      </div>
      <div class="rowflex" id="p1row">
        <button class="avatarBtn" id="av1">🐯</button>
        <input class="pname" id="name1" maxlength="10" placeholder="Player 1" autocomplete="off">
      </div>
      <div class="rowflex hidden" id="p2row">
        <button class="avatarBtn" id="av2">🦄</button>
        <input class="pname" id="name2" maxlength="10" placeholder="Player 2" autocomplete="off">
      </div>
    </div>

    <div class="card">
      <div class="togRow"><span>🛡️ Bumpers<small>No gutter balls — great for kids!</small></span>
        <button class="tog on" id="togBumpers"></button></div>
      <div class="togRow"><span>📱 Tilt steering<small>Tilt your phone to curve the ball!</small></span>
        <button class="tog" id="togTilt"></button></div>
      <div class="togRow"><span>🔊 Sound &amp; voice<small>Crashes, cheers and the announcer</small></span>
        <button class="tog on" id="togSound"></button></div>
    </div>

    <button id="playBtn">▶︎ &nbsp;LET'S BOWL!</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div id="scoreboard"></div>
    <div id="laneWrap">
      <canvas id="lane"></canvas>
      <div id="banner"></div>
      <div id="hint"></div>
      <div class="cornerBtns">
        <button id="muteBtn">🔊</button>
        <button id="homeBtn">🏠</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="hidden">
    <div class="trophy">🏆</div>
    <h2>GAME OVER!</h2>
    <div class="result" id="overResult"></div>
    <div class="newhigh" id="overHigh"></div>
    <button id="againBtn">🎳 Play Again</button>
    <button id="homeBtn2">🏠 Menu</button>
  </div>

  <div id="rotate">📱 Please turn your phone upright to bowl!</div>
</div>
<script src="game.js"></script>
</body>
</html>
